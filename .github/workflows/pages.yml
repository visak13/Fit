# Publish the coach's application to https://visak13.github.io/Fit/.
#
# This workflow is the CI publish path. It rebuilds the site from source on every push to
# master and deploys the freshly built `app/dist` to GitHub Pages. THE REPOSITORY DOES NOT
# CARRY app/dist AT ALL — it is gitignored, precisely because this path builds from source
# and would never read it. See DEPLOYMENT.md, which also carries the no-CI fallback for when
# Actions is unavailable or unwanted.
#
# For this workflow to publish anything, the repository's Pages source must be set to
# "GitHub Actions" (Settings → Pages → Build and deployment → Source). That is a one-time
# manual setting; nothing here can make it for you.

name: Publish to GitHub Pages

on:
  push:
    branches: [master]
  # Lets an operator re-publish the current master without an empty commit.
  workflow_dispatch:

# The three grants the deploy needs and nothing more: read the tree, mint the OIDC token
# `deploy-pages` exchanges, and write the Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time. A queued run is allowed to wait rather than be cancelled, so a push
# that lands mid-deploy still reaches the address instead of being dropped.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out the whole project
        uses: actions/checkout@v4
        # The build reads `design/tokens/` — a SIBLING of app/, outside the application. A
        # checkout scoped to app/ would fail, or worse, half-build.

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          # Pinned to an LTS line that satisfies package.json engines (>=20). The developer
          # machine this project was built on runs 25.1.0; CI is pinned rather than floating so a
          # runner image change cannot silently alter the published bytes. That is the whole
          # reason for the pin, and it stands.
          #
          # THIS COMMENT USED TO CLAIM MORE, AND THE EXTRA CLAIM WAS FALSE. It said the two
          # node lines "produce DIFFERENT bundle hashes from identical source, which is measured,
          # expected". It was not measured, and it is wrong: CI's ubuntu/node-24 build of
          # f9873fc and a Windows/node-25.1.0 build of the same source are BYTE-IDENTICAL —
          # sha256 956b44cadf11b980ed346ea94017bcd7cc9250347bd0fe76d3cd4618b378c9c1 over
          # 1,056,824 bytes, obtained twice by two shells that did not coordinate.
          #
          # There IS a real way to get two different bundle hashes out of the same code, and it
          # is worth knowing because it looks exactly like a platform difference. The build
          # compiles its source stamp into the bundle as a 16-character string, `check:stale`
          # computes that stamp from the bytes ON DISK, and core.autocrlf is true here — so a
          # Windows working tree can stamp differently from the tree CI checks out. Measured
          # 2 August 2026: two builds of 30745d8 differing ONLY in that literal emitted
          # index-BDreLcB9.js and index-BGG4vweb.js, 1,056,824 bytes each, differing in 231
          # bytes — the stamp itself plus one-character renames of minified identifiers. Same
          # code, different filename hash. (The mechanism is esbuild ordering its minifier's
          # identifier alphabet by character frequency; that part is inferred from the shape of
          # the diff, not separately measured.)
          #
          # None of this needs to be taken on trust. Build any commit twice with the stamp held
          # equal and compare the bytes; that is how the numbers above were obtained.
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies from the lockfile
        run: npm ci

      # THE FIVE-COMMAND PUBLISH GATE. A red anywhere below stops the publish; the address keeps
      # serving whatever it served before.
      - name: Typecheck
        run: npm run typecheck

      - name: Core tests
        run: npm test

      # BUILT BEFORE THE SHELL TESTS, AND THAT ORDER IS LOAD-BEARING. Two suites under
      # `app/src/proof` read the PUBLISHED ARTEFACT off the filesystem —
      # `forbidden-claims.test.ts` and `harness-does-not-ship.test.ts`. This repository does not
      # carry `app/dist`, so on a fresh checkout there is nothing for them to read until this
      # step has run. With the build placed after them, run 30710026584 died at "Shell tests"
      # and steps 8-12 plus the whole deploy job were skipped. Moving any artefact-reading suite
      # ahead of this step re-creates that failure — and CI is the only environment where it is
      # visible, because every developer machine has a `dist` on disk.
      - name: Build the site
        run: npm run build

      - name: Shell tests
        run: npm run test:shell

      - name: Tool tests
        run: npm run test:tools

      # Run AFTER the build: `check:stale` compares the build record against a hash of the
      # source tree, so it answers "does dist match the source it was built from". Running it
      # on a tree this job just built is the honest ordering.
      - name: Confirm the built output is not stale
        run: npm run check:stale

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload app/dist as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Path is repository-relative — `defaults.run.working-directory` does not apply to
          # `uses:` steps. The artifact's ROOT becomes https://visak13.github.io/Fit/, which is
          # why `base` stays `/Fit/` on this path.
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
